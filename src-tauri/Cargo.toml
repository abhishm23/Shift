[package]
name = "sift-shell"
version = "0.1.0"
description = "Sift Air-Gapped Commercial Audit Desktop Shell"
authors = ["Sift Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.6", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "shell-open", "window-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
